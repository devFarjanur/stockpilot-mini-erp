services:
  # PHP + Symfony Backend
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: stockpilot_php

    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html

    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=8.4.0&charset=utf8mb4"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

  # MySQL Database
  database:
    image: mysql:8.4

    container_name: stockpilot_database

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  # Nginx Web Server
  nginx:
    image: nginx:alpine

    container_name: stockpilot_nginx

    ports:
      - "${APP_PORT:-8080}:80"

    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

    restart: unless-stopped

  # React + TypeScript Frontend
  frontend:
    image: node:22-alpine

    container_name: stockpilot_frontend

    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "${VITE_PORT:-5173}:5173"

    command: >
      sh -c "if [ -f package.json ];
      then npm install && npm run dev -- --host 0.0.0.0;
      else echo 'Frontend not initialized yet'; sleep infinity;
      fi"

    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
